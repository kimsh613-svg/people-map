<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People Map</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --line:#ddd; --text:#222; --accent:#3b6ea5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; }
  #side { width:300px; padding:16px; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; }
  #mapWrap { flex:1; position:relative; }
  #map { position:absolute; inset:0; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:12px; margin:18px 0 6px; color:#666; letter-spacing:.04em; }
  input, select, button { width:100%; padding:7px 8px; margin-bottom:6px; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  button.secondary { background:#eee; color:var(--text); }
  button.danger { background:#c0392b; }
  button.link { background:none; color:var(--accent); padding:0; width:auto; margin:0; text-decoration:underline; }
  .row { display:flex; gap:6px; } .row > * { flex:1; }
  label.small { font-size:12px; color:#666; display:flex; justify-content:space-between; }
  input[type=range] { padding:0; border:none; }
  #status { font-size:13px; padding:8px 10px; border-radius:6px; background:#f0f0ee; margin:8px 0; line-height:1.4; }
  #status.dirty { background:#fff4d6; }
  #status.err { background:#fbe0de; }
  #whoami { font-size:13px; color:#555; display:flex; justify-content:space-between; align-items:center; }
  #selected { font-size:13px; color:#555; min-height:20px; margin-bottom:6px; }
  .hint { font-size:12px; color:#888; line-height:1.5; margin:4px 0; }
  details summary { cursor:pointer; font-size:13px; color:#555; margin:6px 0; }
  #userList div { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:3px 0; }
  #userList button { width:auto; padding:2px 8px; margin:0; font-size:12px; }
  #legend { position:absolute; right:12px; top:12px; background:rgba(255,255,255,.95); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px; }
  #legend .item { display:flex; align-items:center; gap:8px; margin:4px 0; cursor:pointer; user-select:none; }
  #legend .item.off { opacity:.3; }
  #legend .swatch { width:34px; height:0; border-top-width:4px; }
  #legend .note { font-size:11px; color:#888; margin-top:6px; }

  .overlay { position:fixed; inset:0; background:rgba(30,30,30,.45); display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
  .overlay.show { display:flex; }
  .card { background:#fff; border-radius:12px; padding:22px; width:100%; max-width:360px; max-height:90vh; overflow:auto; }
  .card.wide { max-width:820px; }
  .card h1 { margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid #eee; vertical-align:top; }
  th { color:#666; font-weight:600; position:sticky; top:0; background:#fff; }
  #search { position:absolute; left:12px; top:12px; width:220px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .chip { width:auto; padding:8px 12px; margin:0; border-radius:999px; background:#fff; color:var(--text); border:2px solid var(--c); font-weight:600; }
  .chip.on { background:var(--c); color:#fff; }
  #relTitle { font-size:17px; margin:0 0 4px; }
  @media (max-width:700px){ body{flex-direction:column;} #side{width:100%; height:50vh;} }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div class="overlay" id="loginScreen">
  <div class="card">
    <h1>People Map</h1>
    <input id="loginId" placeholder="아이디" autocomplete="username">
    <input id="loginPw" type="password" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">로그인</button>
    <p class="hint" id="loginMsg"></p>
  </div>
</div>

<!-- 처음 설정 화면 (관리자 1회) -->
<div class="overlay" id="setupScreen">
  <div class="card">
    <h1>처음 설정</h1>
    <p class="hint">관리자만 처음 한 번 하면 됩니다.</p>
    <input id="setupRepo" placeholder="데이터 레포 (예: myname/people-map-data)">
    <input id="setupToken" type="password" placeholder="GitHub 토큰 (github_pat_...)">
    <input id="setupId" placeholder="관리자 아이디">
    <input id="setupPw" type="password" placeholder="관리자 비밀번호">
    <button onclick="setup()">설정 완료</button>
    <p class="hint" id="setupMsg"></p>
  </div>
</div>

<!-- 작업 기록 -->
<div class="overlay" id="logScreen" onclick="if(event.target===this)this.classList.remove('show')">
  <div class="card wide">
    <div class="row" style="align-items:center"><h1 style="margin:0">작업 기록</h1>
      <button class="secondary" style="max-width:80px;margin:0" onclick="logScreen.classList.remove('show')">닫기</button></div>
    <input id="logFilter" placeholder="아이디나 내용으로 찾기" oninput="renderLog()" style="margin-top:12px">
    <table><thead><tr><th>시간</th><th>작업자</th><th>내용</th></tr></thead><tbody id="logBody"></tbody></table>
  </div>
</div>

<aside id="side">
  <h1>People Map</h1>
  <div id="whoami"><span id="whoName"></span><button class="link" onclick="logout()">로그아웃</button></div>
  <div id="status">불러오는 중…</div>

  <h2>인물 추가</h2>
  <input id="pName" placeholder="이름" onkeydown="if(event.key==='Enter')addPerson()">
  <button onclick="addPerson()">추가</button>

  <h2>관계 추가</h2>
  <p class="hint">지도에서 <b>두 사람을 차례로 클릭</b>하면 연결 창이 떠요. 이름을 쳐서 찾을 수도 있어요.</p>
  <input id="rFrom" list="people" placeholder="첫 번째 사람 (이름 입력)" autocomplete="off">
  <input id="rTo" list="people" placeholder="두 번째 사람 (이름 입력)" autocomplete="off" onkeydown="if(event.key==='Enter')pickByName()">
  <button onclick="pickByName()">다음</button>
  <datalist id="people"></datalist>

  <h2>선택 / 삭제</h2>
  <div id="selected">지도에서 인물이나 선을 클릭하세요</div>
  <button class="danger" id="delBtn" onclick="deleteSelected()" disabled>선택 항목 삭제</button>

  <div id="adminArea" style="display:none">
    <h2>관리자</h2>
    <button class="secondary" onclick="openLog()">작업 기록 보기</button>
    <details>
      <summary>계정 관리</summary>
      <input id="newId" placeholder="새 아이디">
      <input id="newPw" type="text" placeholder="비밀번호">
      <button onclick="addAccount()">계정 만들기</button>
      <div id="userList"></div>
    </details>
  </div>
</aside>

<!-- 관계 연결 창 -->
<div class="overlay" id="relScreen" onclick="if(event.target===this)closeRel()">
  <div class="card">
    <p id="relTitle"></p>
    <p class="hint">어떤 관계인가요?</p>
    <div class="chips" id="relChips"></div>
    <label class="small">강도 (선 굵기) <span id="rStrengthVal">3</span></label>
    <input type="range" id="rStrength" min="1" max="5" value="3" oninput="rStrengthVal.textContent=this.value">
    <div class="row" style="margin-top:8px">
      <button class="secondary" onclick="closeRel()">취소</button>
      <button onclick="addRelation()">연결</button>
    </div>
  </div>
</div>

<div id="mapWrap">
  <div id="map"></div>
  <input id="search" list="people" placeholder="🔍 사람 찾기" autocomplete="off" onchange="findPerson()" onkeydown="if(event.key==='Enter')findPerson()">
  <div id="legend"></div>
</div>

<script>
/* ============ 설정 ============
   이 페이지가 있는 공개 레포는 username.github.io/repo-name/ 주소에서 자동으로 알아냅니다.
   커스텀 도메인 등에서 쓰면 owner/repo를 직접 적으세요. */
const SITE = { owner:"", repo:"", branch:"main" };
if (!SITE.owner && location.hostname.endsWith(".github.io")) {
  SITE.owner = location.hostname.split(".")[0];
  SITE.repo  = location.pathname.split("/").filter(Boolean)[0] || `${SITE.owner}.github.io`;
}
const USERS_FILE = "users.json";   // 공개 레포: 아이디 + 비밀번호로 잠근 토큰 (비밀번호 없이는 못 엶)
const DATA_FILE  = "data.json";    // 비공개 레포: 관계도 + 작업 기록

const TYPES = {
  close:   { name:"친밀",     color:"#2e9e5b" },
  work:    { name:"동료/협업", color:"#3b6ea5" },
  rival:   { name:"라이벌",   color:"#e08a1e" },
  hostile: { name:"적대",     color:"#d0342c" },
  cut:     { name:"손절",     color:"#555555", dashes:[8,6] },
};
let relType = "close";
function renderChips() {
  relChips.innerHTML = Object.entries(TYPES).map(([k,t]) =>
    `<button class="chip ${k===relType?"on":""}" style="--c:${t.color}" onclick="relType='${k}';renderChips()">${t.name}</button>`).join("");
}
renderChips();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k)    { try { localStorage.removeItem(k); } catch (e) {} },
};

/* ============ 암호화 (비밀번호로 토큰 잠그기) ============ */
const enc = new TextEncoder(), dec = new TextDecoder();
const toB64 = buf => { let s = ""; new Uint8Array(buf).forEach(x => s += String.fromCharCode(x)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0));
async function pwKey(pw, salt) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt, iterations:250000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function lockToken(tok, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, await pwKey(pw, salt), enc.encode(tok));
  return { salt:toB64(salt), iv:toB64(iv), ct:toB64(ct) };
}
async function unlockToken(u, pw) {
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:fromB64(u.iv) }, await pwKey(pw, fromB64(u.salt)), fromB64(u.ct));
  return dec.decode(pt);
}

/* ============ GitHub 통신 ============ */
let token = "", me = null, cfg = null;   // cfg = users.json 내용
const gh = (repo, path) => `https://api.github.com/repos/${repo}/contents/${path}`;
const hdr = () => ({ Accept:"application/vnd.github+json", ...(token ? { Authorization:`Bearer ${token}` } : {}) });
async function getFile(repo, path, branch) {
  const r = await fetch(`${gh(repo, path)}?ref=${branch}&t=${Date.now()}`, { headers:hdr(), cache:"no-store" });
  if (r.status === 404) return { json:null, sha:null };
  if (r.status === 401 || r.status === 403) throw new Error("권한이 없어요. 관리자에게 문의하세요.");
  if (!r.ok) throw new Error(`GitHub 응답 ${r.status}`);
  const j = await r.json();
  return { json: JSON.parse(dec.decode(fromB64(j.content))), sha: j.sha };
}
async function putFile(repo, path, branch, json, sha, message) {
  const body = { message, branch, content: toB64(enc.encode(JSON.stringify(json, null, 2) + "\n")) };
  if (sha) body.sha = sha;
  const r = await fetch(gh(repo, path), { method:"PUT", headers:{ ...hdr(), "Content-Type":"application/json" }, body:JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) return null;             // 그 사이 다른 사람이 바꿈 → 다시 시도
  if (r.status === 401 || r.status === 403 || r.status === 404) throw new Error("저장 권한이 없어요. 관리자에게 문의하세요.");
  if (!r.ok) throw new Error(`GitHub 응답 ${r.status}`);
  return (await r.json()).content.sha;
}
// 최신본을 받아서 고친 뒤 저장. 충돌하면 최신본을 다시 받아 재시도
async function updateFile(repo, path, branch, change, message) {
  for (let i = 0; i < 4; i++) {
    const cur = await getFile(repo, path, branch);
    const next = change(cur.json);
    if (await putFile(repo, path, branch, next, cur.sha, message)) return next;
  }
  throw new Error("다른 사람과 동시에 저장하고 있어요. 잠시 후 다시 시도할게요.");
}
async function loadUsers() {
  if (SITE.owner) {
    try { const f = await getFile(`${SITE.owner}/${SITE.repo}`, USERS_FILE, SITE.branch); return f.json; } catch (e) {}
  }
  const r = await fetch(`${USERS_FILE}?t=${Date.now()}`, { cache:"no-store" });   // API 한도 초과 등일 때
  return r.ok ? r.json() : null;
}
const dataRepo = () => cfg.dataRepo, dataBranch = () => cfg.dataBranch || "main";
const siteRepo = () => `${SITE.owner}/${SITE.repo}`;

/* ============ 로그인 / 설정 ============ */
async function start() {
  cfg = await loadUsers();
  if (!cfg) { setupScreen.classList.add("show"); return; }
  const saved = store.get("peopleMap.session", null);
  const u = saved && cfg.users.find(x => x.id === saved.id);
  if (u) { token = saved.token; me = u; enter(); }
  else loginScreen.classList.add("show");
}
async function setup() {
  const repo = setupRepo.value.trim().replace(/^https:\/\/github.com\//, "").replace(/\/$/, "");
  const tok = setupToken.value.trim(), id = setupId.value.trim(), pw = setupPw.value;
  if (!repo.includes("/") || !tok || !id || !pw) { setupMsg.textContent = "모든 칸을 채워 주세요."; return; }
  if (!SITE.owner) { setupMsg.textContent = "GitHub Pages 주소에서 열어 주세요."; return; }
  setupMsg.textContent = "설정 중…"; token = tok;
  try {
    await getFile(repo, DATA_FILE, "main");   // 데이터 레포 접근 확인
    const first = { dataRepo:repo, dataBranch:"main", users:[{ id, role:"admin", ...(await lockToken(tok, pw)) }] };
    cfg = await updateFile(siteRepo(), USERS_FILE, SITE.branch, cur => cur || first, `관리자 계정 생성: ${id}`);
    me = cfg.users.find(u => u.id === id);
    if (!me) throw new Error("이미 설정되어 있어요. 새로고침 후 로그인하세요.");
    store.set("peopleMap.session", { id, token }); setupScreen.classList.remove("show"); enter();
  } catch (e) { token = ""; setupMsg.textContent = "실패: " + e.message + " (레포 이름과 토큰 권한을 확인하세요)"; }
}
async function login() {
  const id = loginId.value.trim(), pw = loginPw.value;
  const u = cfg.users.find(x => x.id === id);
  if (!u) { loginMsg.textContent = "아이디 또는 비밀번호가 틀렸어요."; return; }
  loginMsg.textContent = "확인 중…";
  try { token = await unlockToken(u, pw); }
  catch (e) { loginMsg.textContent = "아이디 또는 비밀번호가 틀렸어요."; return; }
  me = u; store.set("peopleMap.session", { id, token }); loginPw.value = ""; loginMsg.textContent = "";
  loginScreen.classList.remove("show"); enter();
}
function logout() { store.del("peopleMap.session"); location.reload(); }
function enter() {
  pending = store.get(pendingKey(), []);
  whoName.textContent = `${me.id}${me.role === "admin" ? " (관리자)" : ""}`;
  adminArea.style.display = me.role === "admin" ? "" : "none";
  renderUsers(); reload();
  if (pending.length) scheduleSave();
}

/* ============ 계정 관리 (관리자) ============ */
async function addAccount() {
  const id = newId.value.trim(), pw = newPw.value;
  if (!id || !pw) { setStatus("아이디와 비밀번호를 적어 주세요.", "err"); return; }
  if (cfg.users.some(u => u.id === id)) { setStatus("이미 있는 아이디예요.", "err"); return; }
  setStatus("계정 만드는 중…");
  try {
    const entry = { id, role:"member", ...(await lockToken(token, pw)) };
    cfg = await updateFile(siteRepo(), USERS_FILE, SITE.branch, c => ({ ...c, users:[...c.users.filter(u => u.id !== id), entry] }), `계정 추가: ${id}`);
    newId.value = ""; newPw.value = ""; renderUsers();
    setStatus(`'${id}' 계정을 만들었어요. 아이디와 비밀번호를 전달해 주세요.`);
  } catch (e) { setStatus("실패: " + e.message, "err"); }
}
async function removeAccount(id) {
  if (!confirm(`'${id}' 계정을 삭제할까요?`)) return;
  try {
    cfg = await updateFile(siteRepo(), USERS_FILE, SITE.branch, c => ({ ...c, users:c.users.filter(u => u.id !== id) }), `계정 삭제: ${id}`);
    renderUsers(); setStatus(`'${id}' 계정을 삭제했어요.`);
  } catch (e) { setStatus("실패: " + e.message, "err"); }
}
function renderUsers() {
  userList.innerHTML = cfg.users.map(u =>
    `<div><span>${esc(u.id)}${u.role === "admin" ? " · 관리자" : ""}</span>${u.id === me.id ? "" : `<button class="danger" onclick="removeAccount('${esc(u.id)}')">삭제</button>`}</div>`).join("");
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

/* ============ 데이터 + 변경 합치기 ============
   변경은 추가/삭제 명령으로 쌓아두었다가, 저장할 때 GitHub의 최신본 위에 다시 적용합니다.
   그래서 여러 사람이 동시에 작업해도 서로의 변경을 지우지 않고, 적용될 때마다 작업 기록이 남습니다. */
let remote = { nodes:[], edges:[], log:[] };
let pending = [];
const pendingKey = () => `peopleMap.pending.${me?.id}`;
function applyOps(base, ops) {
  const d = { nodes:[...(base.nodes||[])], edges:[...(base.edges||[])], log:[...(base.log||[])] };
  for (const op of ops) {
    let text = null;
    if (op.op === "addNode" && !d.nodes.some(n => n.id === op.node.id)) { d.nodes.push(op.node); text = `인물 추가: ${op.node.label}`; }
    if (op.op === "delNode" && d.nodes.some(n => n.id === op.id)) {
      d.nodes = d.nodes.filter(n => n.id !== op.id);
      d.edges = d.edges.filter(e => e.from !== op.id && e.to !== op.id);
      text = `인물 삭제: ${op.id}`;
    }
    if (op.op === "addEdge" && !d.edges.some(e => e.id === op.edge.id)
        && d.nodes.some(n => n.id === op.edge.from) && d.nodes.some(n => n.id === op.edge.to)) {
      d.edges.push(op.edge); text = `관계 추가: ${op.edge.from} – ${op.edge.to} (${TYPES[op.edge.type]?.name}, 강도 ${op.edge.strength})`;
    }
    if (op.op === "delEdge") {
      const e = d.edges.find(x => x.id === op.id);
      if (e) { d.edges = d.edges.filter(x => x.id !== op.id); text = `관계 삭제: ${e.from} – ${e.to} (${TYPES[e.type]?.name})`; }
    }
    if (text && op.meta) d.log.push({ ...op.meta, text });
  }
  return d;
}
function push(op) {
  op.meta = { at:new Date().toISOString(), by:me.id };
  pending.push(op); store.set(pendingKey(), pending); render(); scheduleSave();
}

let saving = false, saveTimer = null;
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 1500); }
async function save() {
  if (!pending.length || saving) return;
  saving = true; setStatus("저장 중…", "dirty");
  const sending = pending.slice();
  try {
    remote = await updateFile(dataRepo(), DATA_FILE, dataBranch(), cur => applyOps(cur || {}, sending), `${me.id}: 변경 ${sending.length}개`);
    pending = pending.slice(sending.length); store.set(pendingKey(), pending);
    saving = false; render();
    if (pending.length) scheduleSave(); else setStatus("저장됨 ✓");
  } catch (e) {
    saving = false; render(false); setStatus("저장 실패: " + e.message, "err");
    setTimeout(save, 15000);
  }
}
async function reload(quiet = false) {
  if (saving || !me) return;
  if (!quiet) setStatus("불러오는 중…");
  try { const f = await getFile(dataRepo(), DATA_FILE, dataBranch()); remote = f.json || { nodes:[], edges:[], log:[] }; render(!quiet || !pending.length); }
  catch (e) { if (!quiet) setStatus("불러오기 실패: " + e.message, "err"); }
}
setInterval(() => { if (!document.hidden) reload(true); }, 20000);   // 다른 사람의 변경 자동 반영

/* ============ 작업 기록 (관리자) ============ */
function openLog() { logScreen.classList.add("show"); renderLog(); }
function renderLog() {
  const q = logFilter.value.trim();
  const rows = applyOps(remote, pending).log.slice().reverse()
    .filter(l => !q || l.by.includes(q) || l.text.includes(q));
  logBody.innerHTML = rows.map(l => {
    return `<tr><td>${new Date(l.at).toLocaleString("ko-KR")}</td><td>${esc(l.by)}</td><td>${esc(l.text)}</td></tr>`;
  }).join("") || `<tr><td colspan="3">기록이 없어요</td></tr>`;
}

/* ============ 지도 ============ */
const nodes = new vis.DataSet(), edges = new vis.DataSet();
const hidden = new Set();
const network = new vis.Network(document.getElementById("map"), { nodes, edges }, {
  nodes: { shape:"box", margin:10, font:{ size:15 }, borderWidth:1.5, shapeProperties:{ borderRadius:8 },
           color:{ background:"#ffffff", border:"#888", highlight:{ background:"#fff", border:"#222" } } },
  edges: { smooth:{ type:"continuous" }, selectionWidth:2 },
  physics: { solver:"forceAtlas2Based", forceAtlas2Based:{ springLength:160, gravitationalConstant:-60 } },
  interaction: { hover:true },
});
function styleEdge(e) {
  const t = TYPES[e.type] || TYPES.work;
  return { ...e, color:{ color:t.color, highlight:t.color, hover:t.color },
           width: 1 + (e.strength || 3) * 1.6, dashes: t.dashes || false, hidden: hidden.has(e.type),
           title: `${t.name} · 강도 ${e.strength || 3}` };
}
function sync(ds, items) { const ids = new Set(items.map(i => i.id)); ds.remove(ds.getIds().filter(id => !ids.has(id))); ds.update(items); }
function render(updateStatus = true) {
  const view = applyOps(remote, pending);
  sync(nodes, view.nodes.map(n => ({ id:n.id, label:n.label })));
  sync(edges, view.edges.map(styleEdge));
  document.getElementById("people").innerHTML = view.nodes.map(n => n.label).sort((a,b) => a.localeCompare(b, "ko"))
    .map(l => `<option value="${esc(l)}"></option>`).join("");
  if (logScreen.classList.contains("show")) renderLog();
  if (updateStatus) setStatus(pending.length ? `저장 대기 중 (${pending.length}개)` : `인물 ${view.nodes.length}명 · 관계 ${view.edges.length}개`, pending.length ? "dirty" : "");
}
function setStatus(msg, cls = "") { const s = document.getElementById("status"); s.textContent = msg; s.className = cls; }

function renderLegend() {
  legend.innerHTML = Object.entries(TYPES).map(([k,t]) =>
    `<div class="item ${hidden.has(k)?"off":""}" onclick="toggleType('${k}')">
       <span class="swatch" style="border-top-color:${t.color};border-top-style:${t.dashes?"dashed":"solid"}"></span>${t.name}</div>`
  ).join("") + `<div class="note">굵기 = 강도 · 클릭해서 숨기기</div>`;
}
function toggleType(k) { hidden.has(k) ? hidden.delete(k) : hidden.add(k); renderLegend(); render(false); }

/* ============ 추가 / 삭제 ============ */
function addPerson() {
  const name = pName.value.trim(); if (!name) return;
  if (nodes.get(name)) { setStatus("이미 있는 이름이에요", "err"); return; }
  push({ op:"addNode", node:{ id:name, label:name } });
  pName.value = "";
}
/* 관계 연결: 지도에서 두 사람을 차례로 클릭하거나, 이름으로 고르기 */
let relPair = null, firstPick = null;
function openRel(a, b) {
  relPair = [a, b];
  relTitle.textContent = `${a}  –  ${b}`;
  relScreen.classList.add("show");
}
function closeRel() {
  relScreen.classList.remove("show"); relPair = null; firstPick = null;
  network.unselectAll(); showSelection(null);
}
function pickByName() {
  const a = rFrom.value.trim(), b = rTo.value.trim();
  if (!nodes.get(a) || !nodes.get(b)) { setStatus("목록에 있는 이름을 골라 주세요", "err"); return; }
  if (a === b) { setStatus("서로 다른 두 사람을 고르세요", "err"); return; }
  openRel(a, b);
}
function addRelation() {
  if (!relPair) return;
  const [from, to] = relPair;
  push({ op:"addEdge", edge:{ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
         from, to, type:relType, strength:+rStrength.value } });
  rFrom.value = ""; rTo.value = "";
  closeRel();
}
function findPerson() {
  const name = search.value.trim();
  if (!nodes.get(name)) return;
  network.selectNodes([name]); network.focus(name, { scale:1.3, animation:{ duration:500 } });
  firstPick = name; showSelection({ type:"node", id:name });
  search.value = "";
}

let selected = null;
function showSelection(sel) {
  selected = sel;
  const el = document.getElementById("selected");
  delBtn.disabled = !sel;
  if (!sel) { el.textContent = "지도에서 인물이나 선을 클릭하세요"; return; }
  if (sel.type === "node") el.innerHTML = `<b>${esc(sel.id)}</b> 선택됨<br>연결하려면 다른 사람을 클릭하세요. (삭제하면 연결된 관계도 함께 지워져요)`;
  else { const e = edges.get(sel.id); el.textContent = `관계: ${e.from} – ${e.to} (${TYPES[e.type]?.name}, 강도 ${e.strength})`; }
}
network.on("click", p => {
  if (p.nodes.length) {
    const id = p.nodes[0];
    if (firstPick && firstPick !== id && nodes.get(firstPick)) { openRel(firstPick, id); return; }
    firstPick = id; showSelection({ type:"node", id });
  } else if (p.edges.length) { firstPick = null; showSelection({ type:"edge", id:p.edges[0] }); }
  else { firstPick = null; showSelection(null); }
});
function deleteSelected() {
  if (!selected) return;
  push(selected.type === "node" ? { op:"delNode", id:selected.id } : { op:"delEdge", id:selected.id });
  firstPick = null; showSelection(null);
  document.getElementById("selected").textContent = "삭제됨";
}

renderLegend();
start();
</script>
</body>
</html>
